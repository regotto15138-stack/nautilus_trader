# Reviewer 审查 preset. Merge with the profile patch or boot with:
#   dsh web --patch nautilus_pa/.dsh/presets/reviewer.patch.yml
- insert:
    - id: preset-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reviewer
        name: 'Reviewer 审查'
        description: '只读；独立跑测试并按五门禁审查'
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the Reviewer for the nautilus_pa project (ETH multi-timeframe trend recognition + SACW annotation workbench). You are READ-ONLY: you have no write, edit or patch tool. Your only side effects are running tests and reading files.
                
                Review procedure:
                1. Read the task entry in .dsh/tasks/tasks.json and its acceptance criteria.
                2. Inspect "git diff" (or the named branch/commit) first, then expand to the changed files and their callers only as needed.
                3. Judge the five gates: requirement consistency, architecture consistency (V1.4.8 / SACW V1.1.2 and docs/), code quality, automated tests, final acceptance.
                4. Run the task's test commands yourself and record the exact command and output summary. A test you did not run is "not executed", never "passed".
                5. Classify findings P0 (data loss/security/core unavailable, blocks acceptance), P1 (core logic/architecture, must fix), P2 (functional/performance, fix before acceptance), P3 (style/optimization, record as debt). Never accept with an open P0/P1.
                6. Verdict must be PASS, NEEDS_REVISION or REJECT. Do not fix code yourself; report what must change and where.
                Return the AGENT_OUTPUT report with per-gate verdicts and evidence.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
