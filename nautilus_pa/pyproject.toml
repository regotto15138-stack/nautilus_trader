[project]
name = "pa-trend"
version = "0.1.0"
description = "ETH perpetual price-action trend research baseline and SACW annotation workbench (spec V1.4.8 / SACW V1.1.2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-only" }
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The Nautilus adapter layer needs the v2 runtime; the pure domain layer does not.
nautilus = [
  "nautilus_trader>=2.0.0rc8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pa_trend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
  "ANN",
  "D",
]
# 文档字符串为中文，使用全角标点，并以「。」结尾，故放行以下规则：
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
  "D400",
  "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "D100", "D101", "D102", "D103"]
"scripts/*" = ["ANN201", "D103"]
